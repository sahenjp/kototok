[workspace]
resolver = "3"
members = [
    "crates/kototok-core",
    "crates/kototok-train",
    "crates/kototok-cli",
    "crates/kototok-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rustc-hash = "2"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
proptest = "1"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[package]
name = "kototok-py"
description = "PyO3 bindings for the AsymScript-BPE (kototok) tokenizer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "kototok"
crate-type = ["cdylib"]

[dependencies]
kototok-core = { path = "../kototok-core", version = "0.1.0" }
kototok-train = { path = "../kototok-train", version = "0.1.0" }
pyo3 = { version = "0.25", features = ["extension-module"] }
rayon.workspace = true

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kototok tokenizer compare</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, "Segoe UI", sans-serif;
    background: #101216; color: #e8eaf0;
    margin: 0; padding: 28px;
  }
  h1 { font-size: 22px; margin: 0 0 20px; font-weight: 700; }
  h1 small { color: #9aa4b2; font-weight: 400; font-size: 14px; }
  .inputs { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .ibox { flex: 1 1 460px; min-width: 340px; }
  .ibox .lbl { font-size: 14px; color: #9aa4b2; margin-bottom: 6px; font-weight: 600; }
  .ibox textarea {
    width: 100%; min-height: 84px; resize: vertical;
    background: #1a1d24; color: #f0f2f6;
    border: 1px solid #3a4150; border-radius: 10px;
    padding: 12px 14px; font-size: 17px; line-height: 1.7;
  }
  .samples button {
    background: #262c38; color: #a8c7fa; border: 1px solid #3a4150;
    border-radius: 8px; padding: 4px 12px; margin: 8px 8px 0 0;
    font-size: 13px; cursor: pointer;
  }
  .samples button:hover { background: #303848; }
  .cols { display: flex; gap: 16px; flex-wrap: wrap; }
  .col {
    flex: 1 1 300px; min-width: 290px;
    background: #1a1d24; border: 1px solid #3a4150;
    border-radius: 12px; padding: 16px;
  }
  .col h2 { font-size: 16px; margin: 0 0 12px; font-weight: 700; color: #f0f2f6; }
  .sec .stat { font-size: 13px; margin: 0 0 8px; color: #9aa4b2; }
  .sec .stat b { color: #d2a8ff; font-size: 14px; }
  .pieces { line-height: 2.4; word-break: break-all; margin-bottom: 16px; }
  .tok {
    display: inline-block; padding: 3px 9px; margin: 0 2px;
    border-radius: 7px; font-size: 17px; font-weight: 500;
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .tok.ws { color: #8b94a3; }
  .c0 { background: #2f6fb0; } .c1 { background: #3f8a4a; }
  .c2 { background: #b0623a; } .c3 { background: #8a5aa0; }
  .c4 { background: #3195a0; } .c5 { background: #a08a30; }
</style>
</head>
<body>
<h1>kototok tokenizer compare <small>asym-full (BEG) vs baselines · vocab 32768</small></h1>

<div class="inputs">
  <div class="ibox">
    <div class="lbl">日本語</div>
    <textarea id="ja" spellcheck="false">私はリンゴを食べる。日本の首都は東京である。新しい方法を試す。</textarea>
    <div class="samples" id="ja-samples"></div>
  </div>
  <div class="ibox">
    <div class="lbl">English</div>
    <textarea id="en" spellcheck="false">The quick brown fox jumps over 42 lazy dogs! Tokenization efficiency determines inference latency.</textarea>
    <div class="samples" id="en-samples"></div>
  </div>
</div>
<div class="cols" id="cols"></div>

<script>
const JA_SAMPLES = {
  "日本語": "私はリンゴを食べる。日本の首都は東京である。新しい方法を試す。",
  "送り仮名": "食べる、食べた、食べて、調べる、比べる、新しい、美しい、正しい",
  "助詞": "日本の気候は地域によって異なる。研究の成果が論文として発表された。",
};
const EN_SAMPLES = {
  "English": "The quick brown fox jumps over 42 lazy dogs! Tokenization efficiency determines inference latency.",
  "Code": "fn main() { let x = vec![1, 2, 3]; println!(\"{x:?}\"); }",
  "Mixed": "混合入力: print(\"こんにちは\"); // 高速トークナイザー実装 12345",
};
const jaIn = document.getElementById("ja");
const enIn = document.getElementById("en");
const cols = document.getElementById("cols");

function sampleButtons(samples, box, target) {
  for (const [label, text] of Object.entries(samples)) {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => { box.value = text; refresh(); };
    target.appendChild(b);
  }
}
sampleButtons(JA_SAMPLES, jaIn, document.getElementById("ja-samples"));
sampleButtons(EN_SAMPLES, enIn, document.getElementById("en-samples"));

let timer = null;
for (const el of [jaIn, enIn]) {
  el.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(refresh, 250);
  });
}

function section(label, m) {
  const sec = document.createElement("div");
  sec.className = "sec";
  const head = document.createElement("div");
  head.className = "stat";
  head.innerHTML = `<span class="lbl">${label} · </span>` + (m.error
    ? `<b>error:</b> ${m.error}`
    : `<b>${m.count}</b> tokens · <b>${m.cps}</b> chars/tok`);
  const pieces = document.createElement("div");
  pieces.className = "pieces";
  (m.pieces || []).forEach((p, i) => {
    const s = document.createElement("span");
    s.className = "tok c" + (i % 6);
    if (/^\s+$/.test(p)) s.classList.add("ws");
    s.textContent = p.replace(/ /g, "␣");
    s.title = "#" + i;
    pieces.appendChild(s);
  });
  sec.append(head, pieces);
  return sec;
}

async function refresh() {
  const q = "ja=" + encodeURIComponent(jaIn.value)
          + "&en=" + encodeURIComponent(enIn.value);
  const res = await fetch("/api/tokenize?" + q);
  const data = await res.json();
  cols.innerHTML = "";
  for (const m of data.models) {
    const div = document.createElement("div");
    div.className = "col";
    const h = document.createElement("h2");
    h.textContent = m.name;
    div.append(h, section("日本語", m.ja || {}), section("English", m.en || {}));
    cols.appendChild(div);
  }
}
refresh();
</script>
</body>
</html>

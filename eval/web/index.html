<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kototok tokenizer compare</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, "Segoe UI", sans-serif;
    background: #101216; color: #e8eaf0;
    margin: 0; padding: 22px;
  }
  h1 { font-size: 20px; margin: 0 0 16px; font-weight: 700; }
  h1 small { color: #9aa4b2; font-weight: 400; font-size: 13px; }
  .inputs { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .ibox { flex: 1 1 420px; min-width: 320px; }
  .ibox .lbl { font-size: 13px; color: #9aa4b2; margin-bottom: 5px; font-weight: 600; }
  .ibox textarea {
    width: 100%; min-height: 72px; resize: vertical;
    background: #1a1d24; color: #f0f2f6;
    border: 1px solid #3a4150; border-radius: 9px;
    padding: 10px 12px; font-size: 15px; line-height: 1.6;
  }
  .samples button {
    background: #262c38; color: #a8c7fa; border: 1px solid #3a4150;
    border-radius: 7px; padding: 3px 10px; margin: 7px 7px 0 0;
    font-size: 12px; cursor: pointer;
  }
  .samples button:hover { background: #303848; }
  .summary {
    overflow-x: auto; margin-bottom: 18px;
    background: #1a1d24; border: 1px solid #3a4150; border-radius: 10px;
  }
  .summary table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .summary th, .summary td { padding: 6px 12px; text-align: right; white-space: nowrap; }
  .summary th { color: #9aa4b2; font-weight: 600; border-bottom: 1px solid #3a4150; }
  .summary td:first-child, .summary th:first-child { text-align: left; }
  .summary tr.best td { background: rgba(63,138,74,.18); }
  .summary tr.best td:first-child { font-weight: 700; }
  .summary tr.best td:first-child::after { content: " ◀ best"; color: #7fd08a; font-size: 11px; }
  .summary td .delta { color: #8b94a3; font-size: 11px; margin-left: 5px; }
  .summary td .delta.bad { color: #e07a5f; }
  .cols { display: flex; gap: 14px; flex-wrap: wrap; }
  .col {
    flex: 1 1 250px; min-width: 245px;
    background: #1a1d24; border: 1px solid #3a4150;
    border-radius: 10px; padding: 13px;
  }
  .col h2 { font-size: 14px; margin: 0 0 9px; font-weight: 700; color: #f0f2f6; }
  .sec .stat { font-size: 12px; margin: 0 0 6px; color: #9aa4b2; }
  .sec .stat b { color: #d2a8ff; }
  .pieces { line-height: 2.15; word-break: break-all; margin-bottom: 12px; }
  .tok {
    display: inline-block; padding: 2px 7px; margin: 0 1px;
    border-radius: 6px; font-size: 15px; font-weight: 500;
    border: 1px solid rgba(255,255,255,.14);
  }
  .tok.ws { color: #8b94a3; }
  .c0 { background: #2f6fb0; } .c1 { background: #3f8a4a; }
  .c2 { background: #b0623a; } .c3 { background: #8a5aa0; }
  .c4 { background: #3195a0; } .c5 { background: #a08a30; }
</style>
</head>
<body>
<h1>kototok tokenizer compare <small>s3o-BKO AsymScript-BPE · vocab 200k vs 10 external tokenizers</small></h1>

<div class="inputs">
  <div class="ibox">
    <div class="lbl">日本語</div>
    <textarea id="ja" spellcheck="false">私はリンゴを食べる。日本の首都は東京である。新しい方法を試す。</textarea>
    <div class="samples" id="ja-samples"></div>
  </div>
  <div class="ibox">
    <div class="lbl">English</div>
    <textarea id="en" spellcheck="false">The quick brown fox jumps over 42 lazy dogs! Tokenization efficiency determines inference latency.</textarea>
    <div class="samples" id="en-samples"></div>
  </div>
  <div class="ibox">
    <div class="lbl">日英混合・コード</div>
    <textarea id="mix" spellcheck="false">関数 tokenize(text) は日本語を subword に分割する。圧縮率は 4.9 bytes/token を記録した。</textarea>
    <div class="samples" id="mix-samples"></div>
  </div>
</div>
<div class="summary" id="summary"></div>
<div class="cols" id="cols"></div>

<script>
const JA_SAMPLES = {
  "日本語": "私はリンゴを食べる。日本の首都は東京である。新しい方法を試す。",
  "送り仮名": "食べる、食べた、食べて、調べる、比べる、新しい、美しい、正しい",
  "助詞": "日本の気候は地域によって異なる。研究の成果が論文として発表された。",
};
const EN_SAMPLES = {
  "English": "The quick brown fox jumps over 42 lazy dogs! Tokenization efficiency determines inference latency.",
  "Code": "fn main() { let x = vec![1, 2, 3]; println!(\"{x:?}\"); }",
  "Prose": "Tokenization is the first bottleneck in any language model pipeline.",
};
const MIX_SAMPLES = {
  "日英混在": "関数 tokenize(text) は日本語を subword に分割する。圧縮率は 4.9 bytes/token を記録した。",
  "仕様書風": "この API は UTF-8 の境界を保ちつつ、英語の superword merge も適用します。latency は 65MB/s です。",
  "コード+日本語": "混合入力: print(\"こんにちは\"); // 高速トークナイザー実装 12345\nif (score > 0.9) { ok(); } // 閾値チェック",
  "チャット風": "AI に「日本の首都は？」と聞いたら \"Tokyo\" と答えた。Next, I asked about 送り仮名 rules.",
};
const jaIn = document.getElementById("ja");
const enIn = document.getElementById("en");
const mixIn = document.getElementById("mix");
const cols = document.getElementById("cols");

function sampleButtons(samples, box, target) {
  for (const [label, text] of Object.entries(samples)) {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => { box.value = text; refresh(); };
    target.appendChild(b);
  }
}
sampleButtons(JA_SAMPLES, jaIn, document.getElementById("ja-samples"));
sampleButtons(EN_SAMPLES, enIn, document.getElementById("en-samples"));
sampleButtons(MIX_SAMPLES, mixIn, document.getElementById("mix-samples"));

let timer = null;
for (const el of [jaIn, enIn, mixIn]) {
  el.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(refresh, 250);
  });
}

function section(label, m) {
  const sec = document.createElement("div");
  sec.className = "sec";
  const head = document.createElement("div");
  head.className = "stat";
  head.innerHTML = `<span class="lbl">${label} · </span>` + (m.error
    ? `<b>error:</b> ${m.error}`
    : `<b>${m.count}</b> tokens · <b>${m.cps}</b> chars/tok`);
  const pieces = document.createElement("div");
  pieces.className = "pieces";
  (m.pieces || []).forEach((p, i) => {
    const s = document.createElement("span");
    s.className = "tok c" + (i % 6);
    if (/^\s+$/.test(p)) s.classList.add("ws");
    s.textContent = p.replace(/ /g, "␣");
    s.title = "#" + i;
    pieces.appendChild(s);
  });
  sec.append(head, pieces);
  return sec;
}

const summaryEl = document.getElementById("summary");
const KEYS = ["ja", "en", "mix"];
const LBL = { ja: "日本語", en: "English", mix: "混合" };

function summary(models) {
  const total = m => KEYS.reduce((a, k) => a + ((m[k] || {}).count || 0), 0);
  const bestTotal = Math.min(...models.map(total).filter(t => t > 0));
  const bestPerKey = {};
  for (const k of KEYS) {
    bestPerKey[k] = Math.min(...models.map(m => (m[k] || {}).count || Infinity));
  }
  let html = "<table><tr><th>model</th>";
  for (const k of KEYS) html += `<th>${LBL[k]}</th>`;
  html += "<th>合計</th><th>vs best</th></tr>";
  const sorted = [...models].sort((a, b) => total(a) - total(b));
  for (const m of sorted) {
    const t = total(m);
    const cls = t === bestTotal ? ' class="best"' : "";
    html += `<tr${cls}><td>${m.name}</td>`;
    for (const k of KEYS) {
      const c = (m[k] || {}).count;
      const mark = c === bestPerKey[k] ? " ★" : "";
      html += `<td>${c != null ? c + mark : "—"}</td>`;
    }
    const d = ((t / bestTotal - 1) * 100).toFixed(1);
    html += `<td><b>${t}</b></td><td>` +
            (t === bestTotal ? "—" : `<span class="delta bad">+${d}%</span>`) +
            "</td></tr>";
  }
  summaryEl.innerHTML = html + "</table>";
}

async function refresh() {
  const q = "ja=" + encodeURIComponent(jaIn.value)
          + "&en=" + encodeURIComponent(enIn.value)
          + "&mix=" + encodeURIComponent(mixIn.value);
  const res = await fetch("/api/tokenize?" + q);
  const data = await res.json();
  summary(data.models);
  cols.innerHTML = "";
  for (const m of data.models) {
    const div = document.createElement("div");
    div.className = "col";
    const h = document.createElement("h2");
    h.textContent = m.name;
    div.append(h, section("日本語", m.ja || {}), section("English", m.en || {}), section("混合", m.mix || {}));
    cols.appendChild(div);
  }
}
refresh();
</script>
</body>
</html>
